<style>
  :root {
    --bg-color: #00639a;
    --logo-color: #ffffff;
    --shadow-color: rgba(0, 0, 0, 0.22);
    --progress-track: rgba(255, 255, 255, 0.25);
    --progress-bar: #ffffff;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #1a1c1e;
      --logo-color: #91ccff;
      --shadow-color: rgba(0, 0, 0, 0.45);
      --progress-track: rgba(145, 204, 255, 0.15);
      --progress-bar: #91ccff;
    }
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body,
  #__nuxt,
  #nuxt-loading {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    user-select: none;
  }

  .logo-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: clamp(56px, 12vw, 80px);
    height: auto;
    aspect-ratio: 295.01 / 403.72;
    fill: var(--logo-color);
    animation: float 2s ease-in-out infinite;
    will-change: transform;
    filter: drop-shadow(0 4px 12px var(--shadow-color));
  }

  .shadow {
    width: clamp(28px, 6vw, 40px);
    height: 8px;
    background: var(--shadow-color);
    border-radius: 50%;
    margin-top: 8px;
    animation: shadow-pulse 2s ease-in-out infinite;
    will-change: transform, opacity;
  }

  .progress-track {
    width: 72px;
    height: 4px;
    background: var(--progress-track);
    border-radius: 9999px;
    overflow: hidden;
    position: relative;
  }

  .progress-indicator {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    background: var(--progress-bar);
    border-radius: 9999px;
    animation: indeterminate 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    will-change: left, right;
  }

  @keyframes float {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-8px);
    }
  }

  @keyframes shadow-pulse {
    0%,
    100% {
      transform: scale(1);
      opacity: 0.8;
    }
    50% {
      transform: scale(0.65);
      opacity: 0.35;
    }
  }

  @keyframes indeterminate {
    0% {
      left: -40%;
      right: 100%;
    }
    60% {
      left: 100%;
      right: -40%;
    }
    100% {
      left: 100%;
      right: -40%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo,
    .shadow,
    .progress-indicator {
      animation: none;
    }
    .shadow {
      opacity: 0.6;
    }
    .progress-indicator {
      left: 0;
      right: 0;
      width: 100%;
    }
  }
</style>
